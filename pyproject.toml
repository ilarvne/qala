[project]
name = "qala-city-companion"
version = "1.0.0"
description = "Grounded, privacy-conscious Astana walking assistant"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "langgraph>=1.0,<2",
  "langchain-core>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "python-multipart>=0.0.20,<1",
  "python-dotenv>=1.1,<2",
  "tzdata>=2025.1",
  "twilio>=9,<10",
  "rank-bm25>=0.2.2,<1",
  "pytest>=8,<10",
  "cryptography>=46,<47",
]

[project.optional-dependencies]
collection = [
    "duckdb>=1.5,<2",
]
neural = [
    "fastembed>=0.7,<1",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
